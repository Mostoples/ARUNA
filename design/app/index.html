<title>ARUNA Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#EAF0EC;
  --bg:#F5F8F6;
  --paper:#FFFFFF;
  --ink:#10201A;
  --ink-2:#4A5B52;
  --muted:#8C9A92;
  --line:#E4EBE7;
  --green:#158A52;
  --green-2:#0E7A6A;
  --green-deep:#0F6B40;
  --green-soft:#E6F4EC;
  --green-mist:#F0F8F3;
  --amber:#B8741A;
  --amber-soft:#FBF0DF;
  --blue:#2D6BD8;
  --blue-soft:#E9F0FC;
  --red:#C8443A;
  --shadow:0 1px 2px rgba(16,32,26,.04),0 8px 22px -12px rgba(16,32,26,.14);
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- gallery page ---------- */
.page{max-width:2200px;margin:0 auto;padding-inline:24px;padding-block:40px 64px;display:grid;gap:32px}
.intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 40px}
.intro h1{margin:0;font-size:clamp(28px,3.4vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.intro h1 span{color:var(--green)}
.intro p{margin:8px 0 0;color:var(--ink-2);max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{font-family:var(--mono);font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--ink-2)}
.rail{display:flex;gap:28px;overflow-x:auto;padding:6px 4px 20px;scroll-snap-type:x mandatory}
.shot{flex:none;display:grid;gap:14px;scroll-snap-align:start}
.shot figcaption{display:grid;gap:2px;padding-left:4px}
.shot figcaption b{font-size:15px}
.shot figcaption span{font-size:13px;color:var(--ink-2);max-width:36ch}
.phone{width:390px;height:844px;border-radius:52px;overflow:hidden;position:relative;background:var(--bg);
  box-shadow:0 0 0 10px #F9FBFA,0 0 0 11px #D5DDD8,0 40px 70px -30px rgba(16,32,26,.35)}
@media (max-width:460px){
  .phone{transform:scale(.82);transform-origin:0 0;margin-right:-70px;margin-bottom:-152px}
}

.renders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.renders figure{margin:0;display:grid;gap:8px}
.renders img{display:block;width:100%;height:auto;border-radius:22px;border:1px solid var(--line)}
.renders figcaption{font-size:13px;color:var(--ink-2);padding-left:4px}
.sub{margin:8px 0 0;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
body.solo .renders,body.solo .sub{display:none}

/* solo = mode screenshot (index.html#home dsb.) */
body.solo{background:var(--bg)}
body.solo .intro,body.solo figcaption{display:none}
body.solo .page{padding:0;max-width:none}
body.solo .rail{padding:0;overflow:visible}
body.solo .shot{display:none}
body.solo .shot.pick{display:block}
body.solo .phone{border-radius:0;box-shadow:none}
body.solo *{animation:none!important;transition:none!important}

/* ---------- app shell ---------- */
.sbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 36px;font-weight:700;font-size:16px;z-index:5}
.sbar .isl{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000}
.sbar .ic{display:flex;gap:6px;align-items:center}
.sbar svg{height:13px;width:auto}
.home-ind{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:9px;background:#10201A;z-index:6}
.scroll{position:absolute;inset:54px 0 0 0;overflow:hidden;padding:6px 20px 110px;display:flex;flex-direction:column;gap:16px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:88px;padding:8px 14px 26px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:4}
.tab{display:grid;justify-items:center;align-content:start;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab .i{font-size:22px}
.tab .pip{display:grid;place-items:center;width:52px;height:30px;border-radius:99px}
.tab.on{color:var(--green)}
.tab.on .pip{background:var(--green-soft)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center}
.sp{flex:1}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:20px;color:var(--ink-2);position:relative}
.ibtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--paper)}
.sec{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.sec h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec a{font-size:13px;font-weight:700;color:var(--green);text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,138,82,.45)}100%{box-shadow:0 0 0 7px rgba(21,138,82,0)}}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.grey{background:var(--bg);color:var(--ink-2)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.ico.g{background:var(--green-soft);color:var(--green)}
.ico.b{background:var(--blue-soft);color:var(--blue)}
.ico.a{background:var(--amber-soft);color:var(--amber)}
.ico.t{background:#E3F2EF;color:var(--green-2)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--green)}
.btn{height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px}
.btn.pri{background:var(--green);color:#fff;box-shadow:0 12px 24px -12px rgba(21,138,82,.8)}
.btn.sec2{background:var(--paper);border:1px solid var(--line)}

/* ---------- 1. masuk ---------- */
.s-login{background:linear-gradient(180deg,#E3F3EA 0%,#F2F9F5 46%,var(--paper) 62%)}
.s-login .scroll{padding:0 24px 40px;gap:0}
.login-brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.08em;font-size:14px;margin-top:8px}
.mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--green),var(--green-2),#22A96A,var(--green));display:grid;place-items:center}
.mark::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.hero-m{position:relative;height:420px;margin:0 -24px;display:grid;place-items:center}
.hero-m::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 70%);top:60px}
.hero-m img{position:relative;height:410px;width:auto;filter:drop-shadow(0 20px 26px rgba(16,32,26,.12))}
.hero-m::after{content:"";position:absolute;bottom:14px;left:50%;width:190px;height:26px;margin-left:-95px;border-radius:50%;background:radial-gradient(closest-side,rgba(16,32,26,.22),rgba(16,32,26,0))}
.float{position:absolute;display:flex;align-items:center;gap:10px;padding:9px 13px 9px 9px;border-radius:16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:var(--shadow);border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.float b{display:block;font-size:15px;color:var(--ink)}
.float .ico{width:32px;height:32px;font-size:16px;border-radius:10px}
.f1{left:20px;top:150px;animation:bob 4s ease-in-out infinite}
.f2{right:18px;top:250px;animation:bob 4s ease-in-out 1.2s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.login-copy h2{margin:6px 0 8px;font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.login-copy h2 span{color:var(--green)}
.login-copy p{margin:0;color:var(--ink-2);font-size:15px}
.dots{display:flex;gap:6px;margin:18px 0 20px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{width:24px;background:var(--green)}
.login-btns{display:grid;gap:10px}
.gmark{width:20px;height:20px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);display:grid;place-items:center}
.gmark::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.login-foot{text-align:center;font-size:14px;color:var(--ink-2);margin-top:14px}
.login-foot b{color:var(--green)}

/* ---------- 2. beranda ---------- */
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#FCE3C2,#F3C38E);display:grid;place-items:center;font-weight:800;color:#8A5418;font-size:17px}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.hello b{font-size:20px;letter-spacing:-.02em}
.dev{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:12px}
.dev .pic{height:150px;border-radius:16px;background:linear-gradient(160deg,#E6F4EC,#F4FAF6);display:grid;place-items:end center;overflow:hidden}
.dev .pic{position:relative}
.dev .pic::after{content:"";position:absolute;bottom:6px;left:50%;width:80px;height:12px;margin-left:-40px;border-radius:50%;background:radial-gradient(closest-side,rgba(16,32,26,.2),rgba(16,32,26,0))}
.dev .pic img{position:relative;z-index:1;height:140px;width:auto;margin-bottom:6px}
.dev .info{display:grid;align-content:space-between;padding:4px 2px}
.dev h4{margin:4px 0 0;font-size:18px;letter-spacing:-.02em}
.dev .id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dev .prog{display:grid;gap:6px;font-size:12.5px;color:var(--ink-2)}
.dev .prog div:first-child{display:flex;justify-content:space-between}
.dev .prog b{color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:13px 14px;display:grid;gap:8px}
.st .top{display:flex;align-items:center;justify-content:space-between}
.st .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600}
.st .v{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
.st .v small{font-size:13px;color:var(--ink-2);font-weight:700;margin-left:2px}
.st svg.sp2{width:100%;height:26px}
.mini-ring{width:34px;height:34px;transform:rotate(-90deg)}
.harv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hv{padding:10px 12px;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:8px}
.hv .ico{grid-row:span 2;width:30px;height:30px;font-size:15px;border-radius:10px}
.hv b{font-size:15px;letter-spacing:-.02em;line-height:1.2}
.hv span:not(.ico){font-size:11px;color:var(--ink-2);font-weight:600}
.stats .st{padding:12px 14px;gap:6px}
.dev .pic img,.devhero img,.hero-m img{background:none}
.tip{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--green-mist);border:1px dashed #BFE0CC;border-radius:18px;font-size:13.5px;color:var(--ink-2)}
.tip b{color:var(--ink)}

/* ---------- 3. monitoring ---------- */
.ttl h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em}
.ttl p{margin:2px 0 0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:#E9EFEB}
.seg b{height:36px;border-radius:11px;display:grid;place-items:center;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.seg b.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(16,32,26,.1)}
.chart{padding:16px 16px 12px}
.chart .hd{display:flex;justify-content:space-between;align-items:flex-start}
.chart .big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.chart .big small{font-size:16px;color:var(--ink-2)}
.delta{font-size:12.5px;font-weight:700;color:var(--green)}
.chart svg{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.list{padding:4px 14px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li b{display:block;font-size:14.5px}
.li span{font-size:12px;color:var(--muted)}
.li .val{text-align:right;font-weight:800;font-size:16px}

/* ---------- 4. chat ---------- */
.s-chat{background:var(--bg)}
.chat-hd{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin:0 -20px;padding-inline:20px}
.bot{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#1FA567,var(--green-2));display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 8px 16px -8px rgba(14,122,106,.7)}
.chat-hd b{font-size:16.5px;display:block}
.chat-hd div span{font-size:12.5px;color:var(--green);font-weight:600}
.day{align-self:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.msg{max-width:82%;padding:11px 14px;font-size:14px;line-height:1.5;border-radius:20px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.ai ul{margin:6px 0 0;padding-left:18px}
.msg.ai li{margin:2px 0}
.data{margin-top:10px;display:grid;gap:6px;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.data div{display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
.data .k{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600}
.time{font-size:10.5px;color:var(--muted);margin-top:-10px}
.time.r{align-self:flex-end}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:ty 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{30%{transform:translateY(-4px);background:var(--green)}}
.composer{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 34px;background:linear-gradient(180deg,rgba(245,248,246,0),var(--bg) 22%);display:grid;gap:10px;z-index:4}
.sugg{display:flex;gap:8px;overflow:hidden}
.sugg span{flex:none;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.inp{display:flex;align-items:center;gap:8px;height:54px;padding:0 6px 0 16px;border-radius:18px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);font-size:14.5px}
.send{width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:19px}

/* ---------- 5. alat ---------- */
.devhero{position:relative;height:250px;border-radius:26px;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,#FFFFFF 0%,#E8F5EE 55%,#D6EDE0 100%);border:1px solid var(--line)}
.devhero img{position:absolute;right:10px;bottom:8px;height:238px;z-index:1}
.devhero::after{content:"";position:absolute;right:40px;bottom:4px;width:130px;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(16,32,26,.2),rgba(16,32,26,0))}
.devhero .txt{position:absolute;left:18px;top:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;width:180px}
.devhero h4{margin:6px 0 0;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.devhero .id{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.devhero .kv{margin-top:auto;display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
.devhero .kv b{color:var(--ink)}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cn{padding:12px 14px;display:flex;gap:10px;align-items:center}
.cn b{display:block;font-size:14px}
.cn span{font-size:12px;color:var(--muted)}
.set{padding:2px 14px}
.set .li .sw{margin-left:auto}
.sw{width:50px;height:30px;border-radius:99px;background:#D3DCD7;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.sw.on{background:var(--green)}
.sw.on::after{left:23px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{height:50px;font-size:14px}
</style>
