<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Daftar penelitian & jurnal terkait biodigester, biogas, dan pengolahan sampah makanan.">
  <title>ARUNA — Penelitian</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("aruna-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="penelitian">

  <div class="app">
    <main class="app-main">
      <div class="app-content">

        <header class="topbar">
          <div class="greet page-head">
            <span class="eyebrow">Penelitian</span>
            <h1>Daftar Riset &amp; Jurnal</h1>
            <p>Referensi karya ilmiah seputar biodigester &amp; food waste</p>
          </div>
          <div class="topbar-actions">
            <button class="neu-btn icon-only theme-toggle" data-theme-toggle aria-label="Ganti mode terang/gelap">
              <svg class="ic ic-sun"><use href="#i-sun"/></svg>
              <svg class="ic ic-moon"><use href="#i-moon"/></svg>
            </button>
            <a class="avatar" href="profil.html" title="Profil">M</a>
          </div>
        </header>

        <!-- Pencarian & filter -->
        <div class="input-wrap section-gap">
          <svg class="ic ic-sm"><use href="#i-flask"/></svg>
          <input class="input" id="searchInput" type="search" placeholder="Cari judul, penulis, atau kata kunci…">
        </div>
        <div class="chip-row" id="topikRow">
          <button class="chip-btn is-active" data-topik="semua">Semua Topik</button>
          <button class="chip-btn" data-topik="biogas">Biogas</button>
          <button class="chip-btn" data-topik="iot">IoT &amp; Sensor</button>
          <button class="chip-btn" data-topik="edukasi">Edukasi</button>
          <button class="chip-btn" data-topik="pupuk">Pupuk Organik</button>
        </div>

        <!-- Daftar penelitian -->
        <div id="listWrap"></div>
        <p class="muted" id="emptyMsg" hidden style="text-align:center;padding:32px 0">
          Tidak ada penelitian yang cocok 😔
        </p>

        <!-- CTA ajukan -->
        <section class="cta-banner glass" style="padding:32px 20px">
          <h2 style="font-size:1.15rem">Punya penelitian terkait?</h2>
          <p>Ajukan karya ilmiahmu agar tampil di daftar ini dan bisa dibaca sekolah lain.</p>
          <button class="btn-accent" data-toast="Form pengajuan dibuka pada tahap integrasi 📝">
            Ajukan Penelitian <svg class="ic ic-sm"><use href="#i-spark"/></svg>
          </button>
        </section>

      </div>
    </main>
  </div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/theme.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script>
    /* Data dummy — nanti dari Firestore koleksi `researches` */
    (function () {
      "use strict";
      var RISET = [
        { topik: "biogas", tahun: 2025,
          judul: "Optimalisasi Produksi Biogas dari Sisa Makanan Kantin Sekolah dengan Digester 80 Liter",
          penulis: "A. Pratama, S. Rahmawati", sumber: "Jurnal Energi Terbarukan Indonesia",
          abstrak: "Menguji pengaruh komposisi sisa makanan terhadap volume biogas pada digester skala sekolah. Hasil: rasio karbohidrat–protein 3:1 menghasilkan gas 18% lebih banyak." },
        { topik: "iot", tahun: 2025,
          judul: "Sistem Monitoring Biodigester Berbasis ESP32 dan Sensor MQ-4 dengan Notifikasi Real-time",
          penulis: "B. Nugroho, D. Lestari", sumber: "Prosiding SNATI",
          abstrak: "Merancang arsitektur IoT ESP32 + RTDB untuk pemantauan suhu, gas, dan level digester dengan latensi < 2 detik dan konsumsi daya rendah." },
        { topik: "edukasi", tahun: 2024,
          judul: "Pengaruh Media Pembelajaran Biodigester Nyata terhadap Literasi Lingkungan Siswa SMK",
          penulis: "C. Wibowo", sumber: "Jurnal Pendidikan Vokasi",
          abstrak: "Studi kuasi-eksperimen pada 120 siswa: pembelajaran berbasis alat nyata meningkatkan skor literasi lingkungan 27% dibanding metode ceramah." },
        { topik: "pupuk", tahun: 2024,
          judul: "Karakterisasi Pupuk Organik Cair Hasil Fermentasi Anaerob Sampah Makanan",
          penulis: "E. Susanti, F. Hidayat", sumber: "Jurnal Agroteknologi",
          abstrak: "Analisis kandungan N-P-K pupuk cair digester menunjukkan kadar nitrogen 1,8% — layak sebagai pupuk daun setelah pengenceran 1:15." },
        { topik: "biogas", tahun: 2023,
          judul: "Kajian Kelayakan Ekonomi Biodigester Skala Sekolah pada Program Makan Bergizi",
          penulis: "G. Ramadhan", sumber: "Jurnal Ekonomi Lingkungan",
          abstrak: "Analisis biaya-manfaat: penghematan LPG dan pupuk membuat titik impas alat tercapai dalam 2,3 tahun untuk sekolah dengan 500+ porsi/hari." },
        { topik: "iot", tahun: 2023,
          judul: "Provisioning WiFi Perangkat IoT melalui Bluetooth Low Energy: Studi Kasus ESP32",
          penulis: "H. Kusuma, I. Maulana", sumber: "Jurnal Teknik Elektro",
          abstrak: "Membandingkan metode provisioning SmartConfig, SoftAP, dan BLE GATT — BLE paling andal (98% sukses) dan paling ramah pengguna awam." }
      ];

      var wrap = document.getElementById("listWrap");
      var cari = "", topik = "semua";

      function render() {
        var q = cari.toLowerCase();
        var rows = RISET.filter(function (r) {
          return (topik === "semua" || r.topik === topik) &&
                 (!q || (r.judul + " " + r.penulis + " " + r.abstrak).toLowerCase().indexOf(q) !== -1);
        });
        document.getElementById("emptyMsg").hidden = rows.length > 0;
        wrap.innerHTML = rows.map(function (r, i) {
          return '<article class="research-card glass anim-in" style="animation-delay:' + (i * 50) + 'ms">' +
            '<div class="research-meta"><span class="chip">' + r.tahun + "</span>" +
            '<span class="chip">' + label(r.topik) + "</span><span>" + r.sumber + "</span></div>" +
            "<h3>" + r.judul + "</h3>" +
            '<div class="research-meta"><svg class="ic ic-sm"><use href="#i-user"/></svg> ' + r.penulis + "</div>" +
            '<p class="abstract">' + r.abstrak + "</p>" +
            '<div class="research-actions">' +
            '<button class="neu-btn" style="min-height:40px;font-size:.78rem" data-toast="Tautan PDF tersedia pada tahap integrasi 🔗">' +
            '<svg class="ic ic-sm"><use href="#i-book"/></svg> Baca Selengkapnya</button>' +
            "</div></article>";
        }).join("");
      }
      function label(t) {
        return { biogas: "Biogas", iot: "IoT & Sensor", edukasi: "Edukasi", pupuk: "Pupuk Organik" }[t] || t;
      }

      document.getElementById("searchInput").addEventListener("input", function () {
        cari = this.value; render();
      });
      document.querySelectorAll("[data-topik]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          topik = btn.getAttribute("data-topik");
          document.querySelectorAll("[data-topik]").forEach(function (b) {
            b.classList.toggle("is-active", b === btn);
          });
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
