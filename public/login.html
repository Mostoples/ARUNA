<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Masuk atau daftar akun ARUNA — aplikasi monitoring smart biodigester.">
  <title>ARUNA — Masuk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("aruna-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="login">

  <div class="auth-wrap">
    <div class="auth-card glass anim-in">

      <div class="auth-brand">
        <a class="brand-logo" href="index.html" aria-label="Kembali ke beranda">
          <svg class="ic"><use href="#i-leaf"/></svg>
        </a>
        <div>
          <div class="brand-name" style="font-size:1.4rem">ARUNA</div>
          <p class="muted" style="font-size:.78rem">Anaerobic Recycling and Upcycling<br>of Nutrient-rich Food Waste</p>
        </div>
      </div>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab is-active" id="tabMasuk" role="tab" aria-selected="true">Masuk</button>
        <button class="auth-tab" id="tabDaftar" role="tab" aria-selected="false">Daftar</button>
      </div>

      <!-- ===== Form Masuk ===== -->
      <form id="formMasuk" novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <div class="input-wrap">
            <svg class="ic ic-sm"><use href="#i-user"/></svg>
            <input class="input" id="loginEmail" type="email" placeholder="nama@sekolah.sch.id" autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="loginPass">Kata Sandi</label>
          <div class="input-wrap">
            <svg class="ic ic-sm"><use href="#i-lock"/></svg>
            <input class="input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>
        <p style="text-align:right;margin:-6px 0 14px">
          <a href="#" data-reset-pass style="font-size:.78rem;color:var(--accent);font-weight:700">Lupa kata sandi?</a>
        </p>
        <button class="btn-accent btn-block" type="submit">Masuk</button>
      </form>

      <!-- ===== Form Daftar ===== -->
      <form id="formDaftar" hidden novalidate>
        <div class="field">
          <label for="regNama">Nama Lengkap</label>
          <input class="input" id="regNama" type="text" placeholder="Nama Anda" autocomplete="name">
        </div>
        <div class="field">
          <label for="regSekolah">Asal Sekolah</label>
          <input class="input" id="regSekolah" type="text" placeholder="Contoh: SMKN 1 Nusantara">
        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input class="input" id="regEmail" type="email" placeholder="nama@sekolah.sch.id" autocomplete="email">
        </div>
        <div class="field">
          <label for="regPass">Kata Sandi</label>
          <input class="input" id="regPass" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password">
        </div>
        <button class="btn-accent btn-block" type="submit">Buat Akun</button>
      </form>

      <div class="auth-alt">atau lanjutkan dengan</div>

      <div style="display:grid;gap:10px">
        <button class="neu-btn" id="btnGoogle" type="button" style="width:100%">
          <svg class="g-logo" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.1 3.57-5.18 3.57-8.81z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.72-4.95H1.27v3.1A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.29a7.2 7.2 0 0 1 0-4.58v-3.1H1.27a12 12 0 0 0 0 10.78l4.01-3.1z"/>
            <path fill="#EA4335" d="M12 4.76c1.76 0 3.35.6 4.6 1.8l3.44-3.45A11.97 11.97 0 0 0 12 0 12 12 0 0 0 1.27 6.61l4.01 3.1C6.22 6.87 8.87 4.76 12 4.76z"/>
          </svg>
          Masuk dengan Google
        </button>
        <button class="btn-ghost" id="btnTamu" type="button" style="width:100%">
          <svg class="ic ic-sm"><use href="#i-user"/></svg> Masuk sebagai Tamu
        </button>
      </div>

      <p class="auth-foot">
        Dengan masuk, Anda menyetujui penggunaan data alat untuk keperluan pembelajaran.
        <br><a href="index.html">← Kembali ke beranda</a>
      </p>
    </div>
  </div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/theme.js"></script>
  <script type="module">
    import {
      auth, db, googleProvider,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signInWithPopup, signInAnonymously, sendPasswordResetEmail,
      onAuthStateChanged, doc, setDoc, serverTimestamp
    } from "./assets/js/firebase-init.js";

    const $ = (s) => document.querySelector(s);
    const tabM = $("#tabMasuk"), tabD = $("#tabDaftar");
    const formM = $("#formMasuk"), formD = $("#formDaftar");

    /* ---------- Tab Masuk / Daftar ---------- */
    function pilih(daftar) {
      tabM.classList.toggle("is-active", !daftar);
      tabD.classList.toggle("is-active", daftar);
      tabM.setAttribute("aria-selected", String(!daftar));
      tabD.setAttribute("aria-selected", String(daftar));
      formM.hidden = daftar;
      formD.hidden = !daftar;
      document.title = daftar ? "ARUNA — Daftar" : "ARUNA — Masuk";
    }
    tabM.addEventListener("click", () => pilih(false));
    tabD.addEventListener("click", () => pilih(true));
    if (location.hash === "#daftar") pilih(true);

    /* ---------- Sudah login? Langsung ke dashboard ---------- */
    let masukBaru = false; // hindari redirect ganda saat proses login
    onAuthStateChanged(auth, (user) => {
      if (user && !masukBaru) location.replace("home.html");
    });

    /* ---------- Util ---------- */
    function sibuk(btn, ya, teks) {
      btn.disabled = ya;
      if (ya) { btn.dataset.label = btn.textContent; btn.textContent = teks || "Memproses…"; }
      else if (btn.dataset.label) btn.textContent = btn.dataset.label;
    }
    const PESAN = {
      "auth/invalid-email": "Format email tidak valid",
      "auth/user-not-found": "Akun tidak ditemukan — coba daftar dulu",
      "auth/wrong-password": "Kata sandi salah",
      "auth/invalid-credential": "Email atau kata sandi salah",
      "auth/email-already-in-use": "Email sudah terdaftar — silakan masuk",
      "auth/weak-password": "Kata sandi terlalu lemah (min. 6 karakter)",
      "auth/too-many-requests": "Terlalu banyak percobaan — coba lagi beberapa menit",
      "auth/popup-closed-by-user": "Jendela Google ditutup sebelum selesai",
      "auth/network-request-failed": "Jaringan bermasalah — periksa koneksi internet"
    };
    function gagal(err) {
      console.warn(err);
      window.arunaToast(PESAN[err.code] || ("Gagal: " + (err.message || err)));
    }

    async function simpanProfil(user, ekstra) {
      try {
        await setDoc(doc(db, "users", user.uid), Object.assign({
          nama: user.displayName || (ekstra && ekstra.nama) || "Pengguna",
          email: user.email || null,
          anonim: user.isAnonymous || false,
          diperbaruiPada: serverTimestamp()
        }, ekstra || {}), { merge: true });
      } catch (e) { console.warn("Profil Firestore:", e); }
    }
    function keDashboard() { location.replace("home.html"); }

    /* ---------- Masuk email ---------- */
    formM.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = formM.querySelector("button[type=submit]");
      masukBaru = true; sibuk(btn, true);
      try {
        const cred = await signInWithEmailAndPassword(auth, $("#loginEmail").value.trim(), $("#loginPass").value);
        await simpanProfil(cred.user);
        keDashboard();
      } catch (err) { masukBaru = false; sibuk(btn, false); gagal(err); }
    });

    /* ---------- Daftar ---------- */
    formD.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = formD.querySelector("button[type=submit]");
      masukBaru = true; sibuk(btn, true, "Membuat akun…");
      try {
        const cred = await createUserWithEmailAndPassword(auth, $("#regEmail").value.trim(), $("#regPass").value);
        await simpanProfil(cred.user, {
          nama: $("#regNama").value.trim() || "Pengguna",
          sekolah: $("#regSekolah").value.trim() || null,
          dibuatPada: serverTimestamp()
        });
        keDashboard();
      } catch (err) { masukBaru = false; sibuk(btn, false); gagal(err); }
    });

    /* ---------- Google ---------- */
    $("#btnGoogle").addEventListener("click", async () => {
      const btn = $("#btnGoogle");
      masukBaru = true; sibuk(btn, true);
      try {
        const cred = await signInWithPopup(auth, googleProvider);
        await simpanProfil(cred.user);
        keDashboard();
      } catch (err) { masukBaru = false; sibuk(btn, false); gagal(err); }
    });

    /* ---------- Tamu (anonymous) ---------- */
    $("#btnTamu").addEventListener("click", async () => {
      const btn = $("#btnTamu");
      masukBaru = true; sibuk(btn, true, "Menyiapkan mode tamu…");
      try {
        const cred = await signInAnonymously(auth);
        await simpanProfil(cred.user, { nama: "Tamu" });
        keDashboard();
      } catch (err) { masukBaru = false; sibuk(btn, false); gagal(err); }
    });

    /* ---------- Lupa kata sandi ---------- */
    document.querySelector("[data-reset-pass]").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = $("#loginEmail").value.trim();
      if (!email) { window.arunaToast("Isi kolom email dulu, lalu klik lagi 📧"); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        window.arunaToast("Tautan reset terkirim ke " + email + " ✅");
      } catch (err) { gagal(err); }
    });
  </script>
</body>
</html>
