<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="AI Edukator ARUNA — tanya jawab seputar biodigester, biogas, dan pengolahan sampah makanan.">
  <title>ARUNA — AI Edukator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("aruna-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="ai">

  <div class="app">
    <main class="app-main">
      <div class="app-content">

        <header class="topbar">
          <div class="greet page-head">
            <span class="eyebrow">AI Edukator</span>
            <h1>Tanya ARUNA 🤖</h1>
            <p>Asisten belajar biodigester &amp; pengolahan sampah</p>
          </div>
          <div class="topbar-actions">
            <button class="neu-btn icon-only theme-toggle" data-theme-toggle aria-label="Ganti mode terang/gelap">
              <svg class="ic ic-sun"><use href="#i-sun"/></svg>
              <svg class="ic ic-moon"><use href="#i-moon"/></svg>
            </button>
            <a class="avatar" href="profil.html" title="Profil">M</a>
          </div>
        </header>

        <section class="chat-card glass">
          <div class="chat-log" id="chatLog" aria-live="polite"></div>

          <div class="suggest-row" id="suggestRow">
            <button class="suggest">Kenapa suhu digester harus 30–40 °C?</button>
            <button class="suggest">Apa itu biogas?</button>
            <button class="suggest">Kenapa gas saya tinggi?</button>
            <button class="suggest">Cara pakai pupuk cair?</button>
            <button class="suggest">Berapa lama fermentasi?</button>
          </div>

          <form class="chat-input" id="chatForm">
            <textarea class="input" id="chatText" rows="1" placeholder="Tulis pertanyaanmu…" aria-label="Pertanyaan"></textarea>
            <button class="send-btn" type="submit" aria-label="Kirim">
              <svg class="ic"><use href="#i-spark"/></svg>
            </button>
          </form>
        </section>

        <p class="muted" style="font-size:.72rem;text-align:center;margin-top:10px">
          Mode demo: jawaban dari basis pengetahuan lokal. Pada tahap integrasi,
          AI Edukator terhubung ke model AI dan data alat Anda secara real-time.
        </p>

      </div>
    </main>
  </div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/theme.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
  <script src="assets/js/ai.js"></script>
</body>
</html>
